<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu primeiro site do curso de JS!</title>
    <style>
        body {
            background-color: rgb(0, 0, 175);
        }
        h1 {
            color: white;
        }
        p { 
            color: white;
            font: normal 20pt Arial;
        }
    </style>
</head>
<body>
    <h1>Olá, mundo!</h1>
    <p>Já me livrei da maldição</p>
    <script>
        let nome = window.prompt('Qual é seu nome?')//  e essa outra bosta interage com o cliente otario de forma escrita 😊
        window.alert('É um grande prazer em te conhecer, ' + nome)// a função do sinal de + foi concatenar o nome guardado na variavel NOME com o alerta
    </script>
</body>
</html>
