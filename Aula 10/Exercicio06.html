<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos DOM</title>
    <style>
        div#area{ /*esse div#area serve para modificar varias coisas na <div>*/
            background-color: aquamarine;
            font: normal 20pt Arial;
            color: rgb(255, 136, 0);
            width: 200px;/* esse pode mudar a largura*/
            height: 200px;/* e esse pode mudar a altura*/
            line-height: 200px;/* consegue mudar o texto de lugar, de cima para baixo*/
            text-align: center;/* este comando pode centralizar o texto*/
        }
    </style>
</head>
<body>
    <div id="area">
         clica ai
    </div>
    <script>
        let a = window.document.getElementById('area')
        a.addEventListener('click', Clicar) //esses addEventListener irão funcionar da mesma forma dos (onclick, onmouseenter, etc) que eu usei direto na <div>
        a.addEventListener('mouseenter', Entrou)
        a.addEventListener('mouseout', Saiu)

          function Clicar() {

             a.innerText = 'Clicou'// quando o eu clicar na <div>, eu crio o objeto chamado a, que é a minha "let a", e este objeto ira mudar o conteudo da div com o comando "a.innerText"
             a.style.background = 'Black'//quando eu clicar a cor ira mudar para Black
        }
        function Entrou() {
            a.innerText = 'Achooo'
            a.style.background = 'Red'
        
        }
           function Saiu() {
            a.innerText = 'Sumiu'
            a.style.background = 'Green'//quando eu sair a cor ira mudar para verde
           }
    </script>
</body>
</html>
