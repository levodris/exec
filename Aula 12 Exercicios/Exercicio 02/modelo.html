<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verificador de Idade</title>
    <link rel="stylesheet" href="estilo.css" />
  </head>
  <body>
    <header>
      <h1>Verificador de Idade</h1>
    </header>
    <section>
      <form>
        <p>
          Ano de nascimento:
          <input type="number" name="ano_nascimento" id="input_ano" min="0" />
        </p>
        <p>
          Sexo:
          <input type="radio" name="sex" id="mas" value="Homem" checked />
          <label for="mas">Masculino</label>
          <input type="radio" name="sex" id="fem" value="Mulher" />
          <label for="fem">Feminino</label>
        </p>
        <p>
          <button type="submit">Verificar</button>
        </p>
      </form>
      <div id="resultado">Preencha os dados acima para ver o resultado!</div>
    </section>
    <footer>
      <p>&copy; Levi</p>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
