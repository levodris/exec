<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rascunho de teste</title>
</head>
<body>

    <script>
        let num1 = Number(window.prompt('Escreva um número: '))
        let soma = num1 + 1//neste codigo eu usei (num1 + 1) pq esse codigo preserva o num1, eu usei o ++num1 em outro codigo e me fudi
        let subtra = num1 - 1
        window.document.write(`Número: ${num1}`)
        window.document.write(`<br>Vizinhos: ${subtra}, ${soma}</br>`)

    </script>
</body>
</html>
